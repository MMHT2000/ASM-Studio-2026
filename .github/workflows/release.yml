name: Build & Release Desktop Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: asm-studio/package-lock.json

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Web Dependencies
        working-directory: ./asm-studio
        run: npm ci

      - name: Run Automated Test Suite
        working-directory: ./asm-studio
        run: npm test

      - name: Build Web Application Bundle
        working-directory: ./asm-studio
        run: npm run build

      - name: Publish .NET Windows Desktop Executable
        working-directory: ./ASMStudio-App
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../dist-desktop

      - name: Package Release Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (!$ver -or $ver -eq "") { $ver = "v1.0.0" }
          $zipName = "ASM-Studio-2026-${ver}-Windows-x64.zip"
          Compress-Archive -Path ./dist-desktop/* -DestinationPath "./$zipName" -Force
          Write-Output "Created $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ASM-Studio-2026-*-Windows-x64.zip
          name: ASM Studio 2026 ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 ASM Studio 2026 — Modern Intel 8086 Assembly IDE

            ### Highlights & Features:
            - **Intel 8086 CPU Emulation**: 16-bit Real Mode architecture, 14 registers, 9 status flags, segmented memory space (0000h–FFFFh).
            - **Monaco Code Editor**: MASM/Emu8086 syntax highlighting, opcode documentation hovers, autocomplete, breakpoints.
            - **Virtual Hardware Devices**: 8-Bit LED bar (Port 0378h), Traffic Lights (Port 0379h), and 4-Digit 7-Segment Display (Port 0300h).
            - **Time-Travel Debugger**: Step Back / Undo instruction (<kbd>Shift+F10</kbd> / <kbd>F8</kbd>) with 150-step deterministic snapshot stack.
            - **Animated Step-by-Step Run**: Controllable execution frequency from 1 Hz up to 60 Hz with live register mutation glow.
            - **Interactive Memory Hex Editor**: Double-click byte editing, segment preset jumps (.DATA, .CODE, STACK, IVT), cell inspector.
            - **Multi-Provider AI Tutor**: Connect Google Gemini, OpenAI (GPT-4o, GPT-5, GPT-6, o3-mini), or Anthropic Claude with open model selection and custom API Base URL.
            - **Editor Customization**: 7 themes (Catppuccin Mocha, VS Code Dark+, Monokai, Dracula, One Dark, GitHub Light, Custom), font families (JetBrains Mono, Fira Code), and custom color pickers.
            - **File Management & Sharing**: Save/Open `.asm`, Export Listing `.lst`, Export Binary `.com`, and share code via URL hash.

            ### Download & Run:
            1. Download `ASM-Studio-2026-v1.0.0-Windows-x64.zip` below.
            2. Extract anywhere on your Windows PC.
            3. Double-click `ASMStudio.exe` to launch immediately (100% offline, zero setup required).

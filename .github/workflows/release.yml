name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: asm-studio/package-lock.json

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Web Dependencies
        working-directory: ./asm-studio
        run: npm ci

      - name: Run Automated Test Suite
        working-directory: ./asm-studio
        run: npm test

      - name: Build Web Application Bundle
        working-directory: ./asm-studio
        run: npm run build

      - name: Publish .NET Windows Desktop Executable
        working-directory: ./ASMStudio-App
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../dist-desktop

      - name: Package Windows Zip Archive
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (!$ver -or $ver -eq "") { $ver = "v1.0.0" }
          $zipName = "ASM-Studio-2026-${ver}-Windows-x64.zip"
          Compress-Archive -Path ./dist-desktop/* -DestinationPath "./$zipName" -Force
          Write-Output "Created $zipName"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ASM-Studio-2026-*-Windows-x64.zip

  build-linux:
    name: Build Ubuntu / Linux Packages (.deb & .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: asm-studio/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./asm-studio
        run: npm ci

      - name: Run Test Suite
        working-directory: ./asm-studio
        run: npm test

      - name: Build Web Application Bundle
        working-directory: ./asm-studio
        run: npm run build

      - name: Download Electron Linux Runtime
        run: |
          mkdir -p download build-linux-staging
          curl -L -o download/electron-linux.zip https://github.com/electron/electron/releases/download/v32.2.0/electron-v32.2.0-linux-x64.zip
          unzip -q download/electron-linux.zip -d build-linux-staging

      - name: Assemble Linux Portable Tarball and Debian Package
        run: node scripts/build_linux_packages.mjs

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            *.deb
            *.tar.gz

  release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p release-assets
          find . -name "*.zip" -exec cp {} release-assets/ \;
          find . -name "*.deb" -exec cp {} release-assets/ \;
          find . -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: ASM Studio 2026 ${{ github.ref_name }} (Windows & Ubuntu/Linux)
          draft: false
          prerelease: false
          body: |
            ## 🚀 ASM Studio 2026 — Multi-Platform Intel 8086 Assembly IDE

            ### 📦 Official Binaries & Packages:
            - **Ubuntu / Debian (`.deb`)**: `asm-studio-2026_${{ github.ref_name }}_amd64.deb`
              Install with: `sudo apt install ./asm-studio-2026_${{ github.ref_name }}_amd64.deb`
            - **Universal Linux (`.tar.gz`)**: `ASM-Studio-2026-${{ github.ref_name }}-Linux-x64.tar.gz`
              Extract and run `./asm-studio` or run `./install.sh` to add desktop shortcuts.
            - **Windows 10 / 11 (`.zip`)**: `ASM-Studio-2026-${{ github.ref_name }}-Windows-x64.zip`
              Extract and run `ASMStudio.exe` (100% offline, zero setup).
